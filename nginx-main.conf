# Standalone main configuration for the Salad image. Do not inherit RunPod's
# extra application servers or wildcard include directories.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # This image only reverse-proxies HTTP/WebSocket traffic; MIME types are
    # supplied by Jupyter/ASR upstream responses, so no local MIME include is needed.
    default_type application/octet-stream;
    include /etc/nginx/conf.d/default.conf;
}
