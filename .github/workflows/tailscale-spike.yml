name: Build private Tailscale ASR variant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish-private-variant:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Reclaim runner disk and preflight
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for path in \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift; do
            if [[ -e "$path" ]]; then
              sudo du -sh "$path"
              sudo rm -rf -- "$path"
            fi
          done
          sudo docker system prune --all --force
          df -h /
          available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
          available_gib="$((available_kib / 1024 / 1024))"
          if (( available_gib < 20 )); then
            printf 'Need at least 20 GiB free after cleanup; runner has %s GiB.\n' "$available_gib" >&2
            exit 1
          fi

      - name: Check variant contract and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n tailscale-salad-entrypoint.sh
          python3 test_tailscale_spike.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build isolated linux/amd64 image without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.tailscale-spike
          platforms: linux/amd64
          load: true
          push: false
          tags: myblockchaincompany/jupyter-salad:private-tailscale-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify child image delta and smoke test before publication
        shell: bash
        env:
          BASE_IMAGE: myblockchaincompany/jupyter-salad:sha-80fbf5d@sha256:1c5d4a04f46ac878439fa40133b324038e426eefa9537dba4fef5b8087e8df09
          CHILD_IMAGE: myblockchaincompany/jupyter-salad:private-tailscale-${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          python3 - <<'PY'
          import difflib
          import json
          import os
          import re
          import subprocess

          base_image = os.environ["BASE_IMAGE"]
          child_image = os.environ["CHILD_IMAGE"]

          def run(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout

          def inspect(image):
              return json.loads(run("docker", "image", "inspect", image))[0]

          base = inspect(base_image)
          child = inspect(child_image)
          base_config = base["Config"]
          child_config = child["Config"]
          for key in base_config:
              if key != "Cmd" and base_config.get(key) != child_config.get(key):
                  raise SystemExit(f"Unexpected image config change: {key}")
          if child_config.get("Cmd") != ["/usr/local/bin/tailscale-salad-entrypoint"]:
              raise SystemExit(f"Unexpected child CMD: {child_config.get('Cmd')!r}")

          base_layers = base["RootFS"]["Layers"]
          child_layers = child["RootFS"]["Layers"]
          if child_layers[:len(base_layers)] != base_layers or len(child_layers) <= len(base_layers):
              raise SystemExit("Child image does not retain the exact base layer prefix plus additions")

          file_hash_command = (
              "set -euo pipefail; "
              "find /etc/nginx/nginx.conf /etc/nginx/conf.d/default.conf "
              "/usr/local/bin/salad-jupyter-entrypoint /opt/asr-lab "
              "/opt/qwen-asr-venv/lib/python3.11/site-packages/qwen_asr "
              "/opt/qwen-asr-venv/lib/python3.11/site-packages/vllm "
              "-type f -print0 | sort -z | xargs -0 sha256sum"
          )
          def preserved_files(image):
              return run("docker", "run", "--rm", "--entrypoint", "/bin/bash", image,
                         "-lc", file_hash_command)
          base_files = preserved_files(base_image)
          child_files = preserved_files(child_image)
          if base_files != child_files:
              print("".join(difflib.unified_diff(
                  base_files.splitlines(keepends=True),
                  child_files.splitlines(keepends=True),
                  fromfile="base-runtime-hashes",
                  tofile="child-runtime-hashes",
              )))
              raise SystemExit("ASR, Qwen, vLLM, nginx, or original entrypoint files changed")

          tailscale_version = run(
              "docker", "run", "--rm", "--entrypoint", "/usr/local/bin/tailscale", child_image, "version"
          )
          tailscaled_version = run(
              "docker", "run", "--rm", "--entrypoint", "/usr/local/bin/tailscaled", child_image, "--version"
          )
          if "1.104.4" not in tailscale_version or "1.104.4" not in tailscaled_version:
              raise SystemExit("Tailscale client or daemon version is not 1.104.4")

          missing_secret = subprocess.run(
              ["docker", "run", "--rm", "--entrypoint", "/usr/local/bin/tailscale-salad-entrypoint", child_image],
              text=True,
              capture_output=True,
          )
          if missing_secret.returncode != 64 or "TAILSCALE_AUTH_KEY must be provided" not in missing_secret.stderr:
              raise SystemExit("Entrypoint did not fail closed when the Tailscale secret is absent")

          history = run("docker", "history", "--no-trunc", child_image)
          if re.search(r"tskey-[A-Za-z0-9_-]{12,}", history):
              raise SystemExit("A Tailscale auth-key literal appears in image history")
          print("Base image configuration/layers and frozen runtime files are unchanged.")
          print("Tailscale 1.104.4 binaries work; missing-secret guard passed; image-history secret scan passed.")
          PY

      - name: Log in to Docker Hub after validation
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish only the isolated commit-specific variant tag
        shell: bash
        env:
          IMAGE_TAG: myblockchaincompany/jupyter-salad:private-tailscale-${{ github.sha }}
        run: docker push "$IMAGE_TAG"
