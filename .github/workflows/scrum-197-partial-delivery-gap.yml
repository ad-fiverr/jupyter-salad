name: Publish SCRUM-197 partial delivery diagnostic image

on:
  push:
    branches:
      - codex/long-session-realtime-partial-delivery-gap
    paths:
      - Dockerfile.partial-delivery-gap
      - asr-lab/asr_lab/asr_service_lifecycle.py
      - asr-lab/asr_lab/asr_qwen_epoch_lifecycle.py
      - asr-lab/asr_lab/qwen_streaming.py
      - asr-lab/asr_lab/service.py
      - asr-lab/asr_lab/benchmark_web/app.mjs
      - .github/workflows/scrum-197-partial-delivery-gap.yml

permissions:
  contents: read

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: myblockchaincompany/jupyter-salad
      BASE_IMAGE: myblockchaincompany/jupyter-salad:private-tailscale-9125118440141e0e22796423b38c062565ccff7d@sha256:ea3df64f62cb5fdce643bb7a7fd175696f51ee04c9c61522f18d51aa783cb63b
      CHILD_IMAGE: myblockchaincompany/jupyter-salad:partial-delivery-gap-ci
      IMMUTABLE_TAG: partial-delivery-gap-${{ github.sha }}
    steps:
      - name: Check out the task branch
        uses: actions/checkout@v7.0.1

      - name: Reclaim runner disk and preflight
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for path in \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift; do
            if [[ -e "$path" ]]; then
              sudo du -sh "$path"
              sudo rm -rf -- "$path"
            fi
          done
          sudo docker system prune --all --force
          df -h /
          available_kib="$(df -Pk / | awk 'NR == 2 {print $4}')"
          available_gib="$((available_kib / 1024 / 1024))"
          if (( available_gib < 20 )); then
            printf 'Need at least 20 GiB free after cleanup; runner has %s GiB.\n' "$available_gib" >&2
            exit 1
          fi

      - name: Check exact overlay contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          expected = [
              "FROM myblockchaincompany/jupyter-salad:private-tailscale-9125118440141e0e22796423b38c062565ccff7d@sha256:ea3df64f62cb5fdce643bb7a7fd175696f51ee04c9c61522f18d51aa783cb63b",
              "COPY asr-lab/asr_lab/asr_service_lifecycle.py /opt/asr-lab/asr_lab/asr_service_lifecycle.py",
              "COPY asr-lab/asr_lab/asr_qwen_epoch_lifecycle.py /opt/asr-lab/asr_lab/asr_qwen_epoch_lifecycle.py",
              "COPY asr-lab/asr_lab/qwen_streaming.py /opt/asr-lab/asr_lab/qwen_streaming.py",
              "COPY asr-lab/asr_lab/service.py /opt/asr-lab/asr_lab/service.py",
              "COPY asr-lab/asr_lab/benchmark_web/app.mjs /opt/asr-lab/asr_lab/benchmark_web/app.mjs",
          ]
          actual = [line.strip() for line in Path("Dockerfile.partial-delivery-gap").read_text().splitlines() if line.strip()]
          if actual != expected:
              raise SystemExit("Dockerfile must contain only the pinned FROM and the five authorized COPY instructions")
          print("Pinned base and exactly five authorized COPY instructions: PASS")
          PY

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build linux/amd64 overlay without publishing
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.partial-delivery-gap
          platforms: linux/amd64
          tags: myblockchaincompany/jupyter-salad:partial-delivery-gap-ci
          load: true
          push: false
          cache-from: type=gha,scope=scrum-197-partial-delivery-gap
          cache-to: type=gha,scope=scrum-197-partial-delivery-gap,mode=max

      - name: Verify base identity, runtime preservation, and overlay smoke checks
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          python3 - <<'PY'
          import hashlib
          import json
          import shlex
          import subprocess
          from pathlib import Path

          base_image = "myblockchaincompany/jupyter-salad:private-tailscale-9125118440141e0e22796423b38c062565ccff7d@sha256:ea3df64f62cb5fdce643bb7a7fd175696f51ee04c9c61522f18d51aa783cb63b"
          child_image = "myblockchaincompany/jupyter-salad:partial-delivery-gap-ci"
          copies = [
              ("asr-lab/asr_lab/asr_service_lifecycle.py", "/opt/asr-lab/asr_lab/asr_service_lifecycle.py"),
              ("asr-lab/asr_lab/asr_qwen_epoch_lifecycle.py", "/opt/asr-lab/asr_lab/asr_qwen_epoch_lifecycle.py"),
              ("asr-lab/asr_lab/qwen_streaming.py", "/opt/asr-lab/asr_lab/qwen_streaming.py"),
              ("asr-lab/asr_lab/service.py", "/opt/asr-lab/asr_lab/service.py"),
              ("asr-lab/asr_lab/benchmark_web/app.mjs", "/opt/asr-lab/asr_lab/benchmark_web/app.mjs"),
          ]
          intended_paths = {destination for _, destination in copies}

          def run(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True).stdout

          def inspect(image):
              return json.loads(run("docker", "image", "inspect", image))[0]

          base = inspect(base_image)
          child = inspect(child_image)
          if base["Config"] != child["Config"]:
              raise SystemExit("Child image changed inherited container configuration")
          base_layers = base["RootFS"]["Layers"]
          child_layers = child["RootFS"]["Layers"]
          if child_layers[:len(base_layers)] != base_layers:
              raise SystemExit("Child RootFS does not retain the exact pinned base layer prefix")
          if len(child_layers) != len(base_layers) + len(copies):
              raise SystemExit("Child RootFS must add exactly one layer for each of the five COPY instructions")

          def container_hash(image, path):
              output = run("docker", "run", "--rm", "--entrypoint", "/bin/bash", image,
                           "-lc", "sha256sum -- " + shlex.quote(path))
              return output.split()[0]

          for source, destination in copies:
              source_hash = hashlib.sha256(Path(source).read_bytes()).hexdigest()
              if container_hash(child_image, destination) != source_hash:
                  raise SystemExit(f"Overlay destination does not match its authorized source: {destination}")

          hash_script = r'''set -euo pipefail
          roots=(/etc/nginx/nginx.conf /etc/nginx/conf.d/default.conf /usr/local/bin/salad-jupyter-entrypoint /opt/asr-lab /opt/qwen-asr-venv/lib/python3.11/site-packages/qwen_asr /opt/qwen-asr-venv/lib/python3.11/site-packages/vllm)
          existing=()
          for path in "${roots[@]}"; do [[ ! -e "$path" ]] || existing+=("$path"); done
          find "${existing[@]}" -type f -print0 | sort -z | xargs -0 -r sha256sum
          '''

          def preserved_hashes(image):
              rows = run("docker", "run", "--rm", "--entrypoint", "/bin/bash", image,
                          "-lc", hash_script).splitlines()
              return {
                  path: digest
                  for row in rows
                  for digest, path in [row.split("  ", 1)]
                  if path not in intended_paths
              }

          if preserved_hashes(base_image) != preserved_hashes(child_image):
              raise SystemExit("An inherited runtime, nginx, entrypoint, Qwen, or vLLM file changed outside the five authorized overlay files")
          print("Pinned base configuration/layers, five source hashes, and frozen runtime hashes: PASS")
          PY

      - name: Log in to Docker Hub after verification
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure the commit-specific tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          url="https://hub.docker.com/v2/repositories/myblockchaincompany/jupyter-salad/tags/${IMMUTABLE_TAG}"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/tag-readback.json" --write-out '%{http_code}' "$url")"
          if [[ "$status" == "404" ]]; then
            echo "Commit-specific tag is absent and safe to publish."
          elif [[ "$status" == "200" ]]; then
            echo "Refusing to overwrite existing image tag ${IMMUTABLE_TAG}." >&2
            exit 1
          else
            echo "Could not establish whether the image tag exists (HTTP ${status}); refusing to publish." >&2
            exit 1
          fi

      - name: Publish only the commit-specific tag and read back its digest
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$CHILD_IMAGE" "${IMAGE}:${IMMUTABLE_TAG}"
          docker push "${IMAGE}:${IMMUTABLE_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${IMMUTABLE_TAG}" | tee "$RUNNER_TEMP/published-image.txt"
          digest="$(awk '/^Digest:/ {print $2; exit}' "$RUNNER_TEMP/published-image.txt")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry digest readback was missing or invalid." >&2
            exit 1
          fi
          echo "Published ${IMAGE}:${IMMUTABLE_TAG} with remote digest ${digest}"
